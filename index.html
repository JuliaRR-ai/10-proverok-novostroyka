<style>
/* Layout: слои-экраны. Старт → «Изучить» → 10 шагов по одному → результат. Крупная типографика, бордо только как акцент */
:root{
  --bg:#F6EFEA; --surface:#FCF9F6; --blush:#EBDAD4; --sage:#DCE2D6; --line:#DDCFC6;
  --ink:#2B1E21; --muted:#74646A;
  --accent:#6B1E2B; --accent-text:#6B1E2B; --on-accent:#FBF3EF;
  --band:#6B1E2B; --on-band:#F8EDE8;
  --serif:'Cormorant Garamond','Times New Roman',serif;
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1517; --surface:#251C1F; --blush:#32242A; --sage:#232A24; --line:#3A2D31;
  --ink:#F1E8E3; --muted:#B4A3A5; --accent:#8E2C3C; --accent-text:#E08B98; --on-accent:#FBF3EF;
  --band:#4B1722; --on-band:#F8EDE8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1517; --surface:#251C1F; --blush:#32242A; --sage:#232A24; --line:#3A2D31;
  --ink:#F1E8E3; --muted:#B4A3A5; --accent:#8E2C3C; --accent-text:#E08B98; --on-accent:#FBF3EF;
  --band:#4B1722; --on-band:#F8EDE8; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1;margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.65 var(--sans);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
/* зерно */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:70;opacity:.05;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3{font-family:var(--serif);font-weight:500;line-height:1.02;margin:0;text-wrap:balance;letter-spacing:-.015em}
p{margin:0 0 1em}
a{color:var(--accent-text);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:3px;border-radius:6px}
.eyebrow{font:700 12px/1.2 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--accent-text)}

.btn{display:inline-flex;align-items:center;gap:14px;background:var(--accent);color:var(--on-accent);font:700 16px/1 var(--sans);
  padding:20px 30px;border-radius:999px;text-decoration:none;border:0;cursor:pointer;transition:transform .25s,filter .25s,box-shadow .25s}
.btn:hover{filter:brightness(1.12);transform:translateY(-2px);box-shadow:0 14px 30px -14px var(--accent)}
.btn .ar{display:inline-block;transition:transform .25s}.btn:hover .ar{transform:translateX(5px)}
.btn.ghost{background:transparent;color:var(--accent-text);box-shadow:inset 0 0 0 1.5px var(--accent-text)}
.btn.sm{padding:13px 20px;font-size:14px}

/* header */
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.hd .in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:22px;padding-block:14px}
.brand{font:500 26px/1 var(--serif);text-decoration:none;color:var(--ink);white-space:nowrap}
.segs{flex:1;display:flex;gap:5px;min-width:0}
.seg{flex:1;height:26px;position:relative;display:block;border:0;background:none;padding:0;cursor:pointer}
.seg::before{content:"";position:absolute;left:0;right:0;top:11px;height:4px;border-radius:4px;background:var(--line)}
.seg i{position:absolute;left:0;top:11px;height:4px;border-radius:4px;background:var(--accent);width:0;transition:width .35s}
.seg.cur::before{background:color-mix(in srgb,var(--accent-text) 35%,var(--line));top:10px;height:6px}
.seg.cur i{top:10px;height:6px}
.hd .cnt{font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted)}
.hd .cnt b{font:700 18px/1 var(--sans);color:var(--accent-text)}
.menu-btn{background:none;border:0;cursor:pointer;color:var(--ink);font:600 14px var(--sans);display:flex;gap:10px;align-items:center;padding:8px 4px}
.menu-btn span{display:block;width:22px;height:2px;background:currentColor;box-shadow:0 7px 0 currentColor,0 -7px 0 currentColor}
body.is-start .segs,body.is-start .cnt,body.is-start .menu-btn{display:none}
body:not(.is-start) .tg-top{display:none}
body.is-start .hd .in{justify-content:space-between}

/* drawer */
.drawer{position:fixed;inset:0;z-index:80;display:flex;justify-content:flex-end;background:rgba(20,10,12,.45)}
.drawer .panel{width:min(440px,100%);height:100%;overflow:auto;background:var(--surface);padding:max(28px,env(safe-area-inset-top,0px)) 28px 40px;animation:slideL .35s cubic-bezier(.2,.8,.2,1)}
.drawer h3{font-size:34px;margin:6px 0 20px}
.drawer a.row{display:grid;grid-template-columns:34px 1fr auto;gap:14px;align-items:baseline;padding:13px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:15px;line-height:1.4}
.drawer a.row b{font:500 26px/1 var(--serif);color:var(--accent-text)}
.drawer a.row em{font:600 12px var(--sans);font-style:normal;color:var(--muted);white-space:nowrap}
.drawer .x{float:right;background:none;border:0;font-size:30px;line-height:1;cursor:pointer;color:var(--ink)}
@keyframes slideL{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}

/* layers */
.layer{animation:enter .6s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}

/* start */
.start-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(30px,5vw,80px);align-items:center;padding-block:36px 64px}
.start h1{font-size:clamp(40px,5.6vw,84px);margin:22px 0 26px}
.start h1 .ten{display:block;font-size:clamp(120px,19vw,280px);line-height:.8;color:transparent;-webkit-text-stroke:1.5px var(--accent-text);margin-bottom:.06em;font-weight:400}
.start h1 em{color:var(--accent-text);font-style:italic}
.lead{font-size:20px;color:var(--muted);max-width:30em}
.acts{display:flex;gap:14px;flex-wrap:wrap;margin-top:34px;align-items:center}
.minis{display:flex;gap:34px;margin-top:46px;flex-wrap:wrap}
.minis b{display:block;font:500 40px/1 var(--serif);color:var(--accent-text)}
.minis span{font-size:13px;color:var(--muted);line-height:1.3;display:block;margin-top:4px}
.stack{position:relative;aspect-ratio:4/5.3;max-width:520px;margin-inline:auto;width:100%}
.stack::before,.stack::after{content:"";position:absolute;inset:0;border-radius:999px 999px 24px 24px;border:1.5px solid var(--accent-text);opacity:.5}
.stack::before{transform:translate(-18px,16px)}
.stack::after{transform:translate(-36px,32px);opacity:.25}
.stack .photo{position:absolute;inset:0;border-radius:999px 999px 24px 24px;overflow:hidden;background:var(--blush);z-index:1}
.stack .photo img{width:100%;height:100%;object-fit:cover;object-position:50% 28%;display:block}
.badge{position:absolute;right:-26px;top:10%;width:120px;height:120px;z-index:3;border-radius:50%;background:var(--bg);display:grid;place-items:center;box-shadow:0 0 0 1px var(--line)}
.badge svg{width:100%;height:100%;animation:spin 22s linear infinite;color:var(--accent-text)}
.badge i{position:absolute;font:500 30px/1 var(--serif);font-style:normal;color:var(--accent-text)}
@keyframes spin{to{transform:rotate(360deg)}}
.float{position:absolute;left:-14px;bottom:8%;z-index:3;background:var(--surface);border-radius:18px;padding:16px 20px;box-shadow:0 18px 40px -20px rgba(0,0,0,.4);font-size:13px;line-height:1.3;color:var(--muted)}
.float b{display:block;font:500 30px/1 var(--serif);color:var(--accent-text);margin-bottom:2px}
.marq{overflow:hidden;background:var(--band);color:var(--on-band);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-block:20px}
.marq .track{display:flex;width:max-content;animation:mq 46s linear infinite}
.marq span{font:italic 400 34px/1 var(--serif);white-space:nowrap;padding-right:34px}
.marq span::after{content:"✦";font:400 16px var(--sans);margin-left:34px;opacity:.6}
@keyframes mq{to{transform:translateX(-50%)}}

/* how */
.how{display:grid;grid-template-columns:.8fr 1.2fr;gap:clamp(28px,6vw,90px);align-items:center;padding-block:56px 72px}
.how .ph{border-radius:24px;overflow:hidden;aspect-ratio:4/5;background:var(--blush)}
.how .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
.how h2{font-size:clamp(38px,5vw,68px);margin:16px 0 30px}
.steps{list-style:none;margin:0 0 36px;padding:0;display:grid;gap:0;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:56px 1fr;gap:12px;padding:18px 0;border-top:1px solid var(--line)}
.steps li:last-child{border-bottom:1px solid var(--line)}
.steps li::before{content:counter(s);font:400 44px/1 var(--serif);color:var(--accent-text)}

/* check step */
.step{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(30px,6vw,100px);padding-block:44px 72px}
.side{position:sticky;top:96px;align-self:start}
.num{font:400 clamp(150px,19vw,290px)/.78 var(--serif);color:transparent;-webkit-text-stroke:1.5px var(--accent-text);transition:color .5s;margin-bottom:.1em;font-variant-numeric:lining-nums}
.step.done .num{color:var(--accent-text)}
.side h2{font-size:clamp(32px,3.6vw,52px);margin:18px 0 0}
.sub{font:italic 400 24px/1.3 var(--serif);color:var(--muted);margin-top:14px}
.prog{margin-top:26px;font-size:13px;color:var(--muted)}
.prog b{color:var(--accent-text)}
.main{min-width:0}
.shot{margin:0 0 32px;border-radius:24px;overflow:hidden;aspect-ratio:4/3;background:var(--blush)}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot figcaption{display:none}
.shot.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;aspect-ratio:auto;background:none;border-radius:0;overflow:visible}
.shot.two img{aspect-ratio:3/4;border-radius:22px;background:var(--blush)}
.intro{font-size:20px;line-height:1.6;color:var(--ink);margin:0 0 34px}
.intro p{margin:0 0 .8em}.intro p:last-child{margin:0}
.label{font:700 12px/1.2 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--accent-text);margin:0 0 14px}
.checks{list-style:none;margin:0 0 44px;padding:0}
.checks li{border-top:1px solid var(--line)}
.checks li:last-child{border-bottom:1px solid var(--line)}
.checks label{display:grid;grid-template-columns:30px 1fr;gap:18px;padding:20px 6px;cursor:pointer;font-size:18px;line-height:1.55;transition:background .2s}
.checks label:hover{background:color-mix(in srgb,var(--blush) 45%,transparent)}
.checks input{appearance:none;-webkit-appearance:none;width:28px;height:28px;margin:1px 0 0;border:1.5px solid var(--muted);border-radius:50%;background:transparent;display:grid;place-content:center;cursor:pointer;transition:.2s}
.checks input::after{content:"";width:12px;height:7px;border-left:2.5px solid var(--on-accent);border-bottom:2.5px solid var(--on-accent);transform:rotate(-45deg) scale(0);margin-top:-3px;transition:transform .2s}
.checks input:checked{background:var(--accent);border-color:var(--accent)}
.checks input:checked::after{transform:rotate(-45deg) scale(1)}
.checks input:checked + span{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 50%,transparent)}
.story{background:var(--blush);border-radius:26px;padding:clamp(24px,3.4vw,42px);margin-bottom:28px}
.story.alt{background:var(--sage)}
.story p{font-size:17px}
.story .more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s}
.story .more>div{overflow:hidden;min-height:0}
.story.open .more{grid-template-rows:1fr}
.story .tog{background:none;border:0;padding:0;margin-top:4px;color:var(--accent-text);font:700 14px var(--sans);cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.story .tog::after{content:"↓";transition:transform .3s}.story.open .tog::after{transform:rotate(180deg)}
.cta{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--surface);border-radius:22px;padding:22px 24px;margin-bottom:28px;box-shadow:inset 0 0 0 1px var(--line)}
.cta p{margin:0;flex:1 1 240px;font-size:16px}
.nav{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:44px;padding-top:28px;border-top:1px solid var(--line)}
.nav .btn.ghost{padding:18px 26px}

/* result */
.res{background:var(--band);color:var(--on-band);border-radius:36px;padding:clamp(28px,6vw,84px);margin-block:40px 20px}
.res .eyebrow{color:color-mix(in srgb,var(--on-band) 70%,transparent)}
.res h2{font-size:clamp(40px,6vw,88px);margin:16px 0 8px}
.score{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin:8px 0 30px}
.score b{font:400 clamp(110px,20vw,260px)/.9 var(--serif);font-variant-numeric:lining-nums}
.score span{font-size:22px;opacity:.8}
.rbar{height:6px;background:rgba(255,255,255,.18);border-radius:6px;overflow:hidden;margin-bottom:40px}
.rbar i{display:block;height:100%;width:0;background:var(--on-band);transition:width .6s}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tier{border-radius:22px;padding:28px;background:rgba(255,255,255,.07);transition:.3s;opacity:.7;min-width:0}
.tier.on{background:var(--on-band);color:#2B1E21;opacity:1;transform:translateY(-6px)}
.tier .rng{font:700 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.tier .dot{width:12px;height:12px;border-radius:50%;flex:none}
.tier h3{font-size:30px;line-height:1.08;margin:16px 0 14px}
.tier p{font-size:15px;line-height:1.55;margin:0 0 .8em}
.res .reset{background:none;border:0;color:inherit;opacity:.65;font:600 13px var(--sans);text-decoration:underline;cursor:pointer;margin-top:26px;padding:0}
.final{display:grid;grid-template-columns:1fr .8fr;gap:clamp(28px,6vw,90px);align-items:center;padding-block:90px 70px}
.final h2{font-size:clamp(36px,5vw,70px);margin:16px 0 26px}
.final .big{font:500 clamp(24px,2.8vw,34px)/1.25 var(--serif);color:var(--accent-text);margin:26px 0}
.final .ph{border-radius:24px 24px 999px 999px;overflow:hidden;aspect-ratio:4/5;background:var(--blush)}
.final .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
footer{border-top:1px solid var(--line);padding-block:26px 40px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}

@media (max-width:900px){
  body{font-size:17px}
  .start-grid,.how,.step,.tiers,.final{grid-template-columns:1fr}
  .start-grid{gap:50px;padding-top:12px}
  .stack{max-width:360px}
  .badge{right:-6px;width:96px;height:96px}
  .how .ph{aspect-ratio:1/1;max-width:420px}
  .side{position:static;display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:end}
  .num{grid-row:1/4;font-size:130px;margin:0}
  .side .eyebrow,.side h2,.sub,.prog{grid-column:2}
  .side h2{margin-top:6px;font-size:30px}
  .sub{font-size:20px;margin-top:6px}
  .hd .in{gap:12px}
  .brand{font-size:22px}
  .final .ph{max-width:420px;aspect-ratio:1/1}
}
@media (max-width:520px){.side{grid-template-columns:1fr}.side .eyebrow,.side h2,.sub,.prog{grid-column:1}.num{grid-row:auto;font-size:140px}.tg-top{display:none!important}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ===== мобильная версия ===== */
#bar{display:none}
body.mob{font-size:17px;padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
body.mob .wrap{max-width:480px}
body.mob .hd .in{max-width:480px;flex-wrap:wrap;gap:4px 12px;padding-block:10px 2px}
body.mob .brand{font-size:22px;margin-right:auto}
body.mob .segs{order:5;flex:0 0 100%}
body.mob .tg-top{display:none!important}
body.mob #bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:55;gap:10px;justify-content:center;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
body.mob #bar .in{width:100%;max-width:480px;display:flex;gap:10px}
body.mob #bar .btn{flex:1;justify-content:center;padding:18px 20px}
body.mob #bar .btn.sq{flex:0 0 58px;padding:0;height:58px;justify-content:center}
body.mob .start-grid{grid-template-columns:1fr;gap:38px;padding-block:8px 44px}
body.mob .start-grid>.stack{order:-1;max-width:280px;margin-top:6px}
body.mob .start h1{margin:18px 0 18px;font-size:38px}
body.mob .start h1 .ten{font-size:112px}
body.mob .lead{font-size:18px}
body.mob .start .acts .btn:not(.ghost){display:none}
body.mob .start .acts{margin-top:24px}
body.mob .minis{gap:22px;margin-top:30px}body.mob .minis b{font-size:32px}
body.mob .badge{width:88px;height:88px;right:-14px}
body.mob .float{left:-10px;padding:12px 16px}
body.mob .marq span{font-size:26px}
body.mob .how{grid-template-columns:1fr;padding-block:20px 40px;gap:28px}
body.mob .how .ph{aspect-ratio:1/1;max-width:100%}
body.mob .how .acts{display:none}
body.mob .how h2{font-size:38px;margin-bottom:20px}
body.mob .steps li{grid-template-columns:44px 1fr;padding:14px 0}
body.mob .steps li::before{font-size:34px}
body.mob .step{grid-template-columns:1fr;gap:24px;padding-block:20px 40px}
body.mob .side{position:static;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:end}
body.mob .num{grid-row:1/4;font-size:104px;margin:0}
body.mob .side .eyebrow,body.mob .side h2,body.mob .sub,body.mob .prog{grid-column:2}
body.mob .side h2{font-size:26px;margin-top:4px}
body.mob .sub{font-size:19px;margin-top:4px}
body.mob .intro{font-size:18px}
body.mob .checks label{padding:18px 2px;font-size:17px;gap:14px}
body.mob .checks input{width:30px;height:30px}

    <p>Вот это уже серьёзный подход к покупке недвижимости! Вы изучили застройщика, условия сделки, перспективы района, расходы на содержание и ликвидность квартиры.</p>
    <p>Но важно не только количество галочек, а качество каждой проверки. Даже один пропущенный критический риск может стоить миллионов.</p><p>И если все ключевые вопросы закрыты, у вас гораздо больше оснований рассчитывать, что квартира будет радовать вас не только сегодня, но и через 5–10 лет.</p></div>
  </div>
  <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:26px"><a class="btn ghost" style="color:var(--on-band);box-shadow:inset 0 0 0 1.5px var(--on-band)" href="#step-${N}"><span class="ar">←</span> К проверке ${N}</a><button class="reset" id="reset" type="button">Сбросить все отметки</button></div>
 </div>
 <div class="final">
  <div>
   <div class="eyebrow">И вот что важно понимать</div>
   <h2>Каждая проверка требует времени, знаний и понимания рынка</h2>
   <p>Каждый из 40 пунктов требует времени, умения работать с документами и знания рынка недвижимости. Можно потратить недели на самостоятельную проверку, а можно доверить это тем, кто занимается этим каждый день.</p>
   <p class="big">За моими плечами и плечами моей команды более 6000 сделок и детальный анализ более 400 жилых комплексов Москвы.</p>
   <p>Мы не просто подбираем красивые квартиры. Мы проверяем застройщиков, изучаем планы развития районов, сравниваем финансовые условия и оцениваем перспективы недвижимости. Как итог у вас будет <b>юридическое заключение юриста, что все проверки пройдены и объект к приобретению рекомендован.</b></p>
   <p><b>Напишите мне, чтобы получить консультацию, подобрать подходящий вариант с учётом ваших целей и задач, и проверить все нюансы перед сделкой.</b></p>
   <a class="btn" href="${TG}" target="_blank" rel="noopener" style="margin-top:10px">Написать нам <span class="ar">→</span></a>
  </div>
  <div class="ph"><img src="img/cta.jpg" alt="Юлия Юмина с журналом над головой, как с крышей" loading="lazy"></div>
 </div>
 <footer><span>Юлия Юмина · подбор и проверка новостроек Москвы</span><a href="${TG}" target="_blank" rel="noopener">Telegram: @uminachat</a></footer>
</section>`;

const app=document.getElementById('app');
app.innerHTML=Object.values(L).join('');
const layers=[...app.querySelectorAll('.layer')];
layers.forEach(l=>l.hidden=true);

/* header segments + drawer */
const segs=document.getElementById('segs');
segs.innerHTML=S.map((s,i)=>`<a class="seg" href="#step-${i+1}" aria-label="Проверка ${i+1}"><i></i></a>`).join('');
const segEls=[...segs.children];
document.getElementById('dlist').innerHTML=
 `<a class="row" href="#how"><b>·</b><span>Как пользоваться</span><em></em></a>`+
 S.map((s,i)=>`<a class="row" href="#step-${i+1}"><b>${i+1}</b><span>${s.t}</span><em data-d="${i+1}"></em></a>`).join('')+
 `<a class="row" href="#result"><b>✓</b><span>Результат</span><em></em></a>`;
const drawer=document.getElementById('drawer');
document.getElementById('menu').onclick=()=>drawer.hidden=false;
document.getElementById('dx').onclick=()=>drawer.hidden=true;
drawer.addEventListener('click',e=>{if(e.target===drawer||e.target.closest('a.row'))drawer.hidden=true});

const boxes=[...document.querySelectorAll('.checks input')];
const cnt=n=>boxes.filter(b=>b.dataset.k.startsWith(`c${n}_`)&&b.checked).length;
function render(){
  let c=0;boxes.forEach(b=>{b.checked=!!state[b.dataset.k];if(b.checked)c++});
  for(let n=1;n<=N;n++){const d=cnt(n);
    document.getElementById('L-step-'+n).classList.toggle('done',d===4);
    document.querySelector(`[data-p="${n}"]`).textContent=d;
    segEls[n-1].firstElementChild.style.width=d/4*100+'%';
    document.querySelector(`[data-d="${n}"]`).textContent=d+'/4';}
  document.getElementById('hcount').textContent=c;
  document.getElementById('score').textContent=c;
  document.getElementById('rbar').style.width=c/40*100+'%';
  const t=c<=12?0:c<=31?1:2;
  document.querySelectorAll('.tier').forEach(e=>e.classList.toggle('on',c>0&&+e.dataset.tier===t));
}
boxes.forEach(b=>b.addEventListener('change',()=>{state[b.dataset.k]=b.checked;save();render()}));
document.getElementById('reset').onclick=()=>{state={};save();render()};
document.querySelectorAll('.story .tog').forEach(btn=>btn.onclick=()=>{
  const st=btn.closest('.story');st.classList.toggle('open');btn.textContent=st.classList.contains('open')?'Свернуть':'Читать дальше'});

const valid=new Set(['start','how','result',...S.map((_,i)=>'step-'+(i+1))]);
let route=function(){
  let h=location.hash.slice(1);if(!valid.has(h))h='start';
  layers.forEach(l=>{const on=l.id==='L-'+h;if(on&&l.hidden){l.hidden=false;l.style.animation='none';void l.offsetWidth;l.style.animation=''}else if(!on)l.hidden=true});
  document.body.classList.toggle('is-start',h==='start');
  segEls.forEach((s,i)=>s.classList.toggle('cur',h==='step-'+(i+1)));
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea'))return;
  const order=['start','how',...S.map((_,i)=>'step-'+(i+1)),'result'];
  let h=location.hash.slice(1);if(!valid.has(h))h='start';const i=order.indexOf(h);
  if(e.key==='ArrowRight'&&i<order.length-1)location.hash=order[i+1];
  if(e.key==='ArrowLeft'&&i>0)location.hash=order[i-1];
});
render();route();

/* мобильная панель действий и свайпы */
if(document.body.classList.contains('mob')){
  const bar=document.createElement('div');bar.id='bar';document.body.appendChild(bar);
  const _route=route;
  route=function(){
    _route();
    let h=location.hash.slice(1);if(!valid.has(h))h='start';
    const sq=href=>`<a class="btn ghost sq" href="${href}" aria-label="Назад">←</a>`;
    let html='';
    if(h==='start')html=`<a class="btn" href="#how">Изучить <span class="ar">→</span></a>`;
    else if(h==='how')html=sq('#start')+`<a class="btn" href="#step-1">Начать проверки <span class="ar">→</span></a>`;
    else if(h==='result')html=sq('#step-'+N)+`<a class="btn" href="${TG}" target="_blank" rel="noopener">Написать нам <span class="ar">→</span></a>`;
    else{const n=+h.split('-')[1];
      html=sq(n>1?'#step-'+(n-1):'#how')+`<a class="btn" href="${n<N?'#step-'+(n+1):'#result'}">${n<N?'Проверка '+(n+1):'Результат'} <span class="ar">→</span></a>`}
    bar.innerHTML='<div class="in">'+html+'</div>';
  };
  window.removeEventListener('hashchange',_route);window.addEventListener('hashchange',route);route();
  let sx=0,sy=0;
  document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  document.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)<80||Math.abs(dy)>45)return;
    const order=['start','how',...S.map((_,i)=>'step-'+(i+1)),'result'];
    let h=location.hash.slice(1);if(!valid.has(h))h='start';const i=order.indexOf(h);
    if(dx<0&&i<order.length-1)location.hash=order[i+1];
    if(dx>0&&i>0)location.hash=order[i-1];
  },{passive:true});
}
</script>
</body>
</html>
